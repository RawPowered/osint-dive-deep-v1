<title id="title">Dive Deep source architecture</title><desc id="desc">The local Research Studio connects to case evidence and public source adapters. An optional hosted frontend connects to a web API, database, job-scoped worker, and private artifact storage. Hosted operation was not launched as a public service.</desc>

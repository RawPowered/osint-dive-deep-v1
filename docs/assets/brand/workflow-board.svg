<title id="title">Dive Deep research path</title><desc id="desc">Four stages connect geographic research, online discovery, technology rules and human evidence review.</desc>
<path d="M1 1h1218l60 55v383H35L1 405Z" fill="#090A0B" stroke="#373A3D" stroke-width="2"/>
<path d="M1 1h434l-7 7H1Z" fill="#D5FF3F"/>

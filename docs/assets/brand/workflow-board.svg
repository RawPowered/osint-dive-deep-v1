<g font-family="Arial,sans-serif"><text x="36" y="51" font-size="15" font-weight="700" letter-spacing="3" fill="#D5FF3F">RAWPOWERED / RESEARCH SYSTEMS</text>
<text x="34" y="99" font-size="37" font-weight="700" fill="#F7F8F9">Follow the evidence through four decisions.</text>
<text x="36" y="132" font-size="18" fill="#B9BEC2">Scope, source, qualification and review stay visible.</text></g><path d="M36 166h263l22 20v188H54l-18-18Z" fill="#121416" stroke="#373A3D" stroke-width="1.5"/>
